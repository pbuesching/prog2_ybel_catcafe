name: GitHub CI

on:
    # push on master branch
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    # manually triggered
    workflow_dispatch:

jobs:

    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   name: Gradle Rechte setzen
                run: chmod +x gradlew
            -   name: Java Kompilieren
                run: ./gradlew compileJava
    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   name: JUnit-Tests ausführen
                run: ./gradlew test

    spotless:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v3
                with:
                    java-version: '25'
                    distribution: 'temurin'
            - name: Spotless Check
              run: ./gradlew spotlessCheck
